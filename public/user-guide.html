<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapIt — User Guide</title>
<style>
  @font-face {
    font-family: 'GuideSerif';
    src: local('Georgia'), local('Times New Roman');
  }

  :root{
    --orange:#F06030; --orange2:#FF7A50; --orange-soft:#FDE4DA;
    --ground:#F7F9FC; --panel:#FFFFFF; --card:#F0F3F8; --card2:#E3E8F0;
    --ink:#111827; --muted:#5F6773; --muted2:#4B5563;
    --border:rgba(17,24,39,0.09); --border2:rgba(17,24,39,0.15);
    --blue:#3B82F6; --green:#22C55E; --gold:#F59E0B; --red:#EF4444;
    --glow:rgba(240,96,48,.16);
    --shadow:0 10px 34px rgba(17,24,39,.10);
    --map:#EAF0F4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#12161D; --panel:#1A2029; --card:#20272F; --card2:#2A323C;
      --ink:#EEF1F5; --muted:#98A2B0; --muted2:#B8C0CC;
      --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
      --glow:rgba(240,96,48,.22);
      --shadow:0 10px 34px rgba(0,0,0,.42);
      --map:#171D25;
    }
  }
  :root[data-theme="dark"]{
    --ground:#12161D; --panel:#1A2029; --card:#20272F; --card2:#2A323C;
    --ink:#EEF1F5; --muted:#98A2B0; --muted2:#B8C0CC;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
    --glow:rgba(240,96,48,.22);
    --shadow:0 10px 34px rgba(0,0,0,.42);
    --map:#171D25;
  }
  :root[data-theme="light"]{
    --ground:#F7F9FC; --panel:#FFFFFF; --card:#F0F3F8; --card2:#E3E8F0;
    --ink:#111827; --muted:#5F6773; --muted2:#4B5563;
    --border:rgba(17,24,39,0.09); --border2:rgba(17,24,39,0.15);
    --glow:rgba(240,96,48,.16);
    --shadow:0 10px 34px rgba(17,24,39,.10);
    --map:#EAF0F4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.6;
  }
  h1,h2,h3{
    font-family:'GuideSerif',Georgia,'Times New Roman',serif;
    font-weight:400; text-wrap:balance; margin:0;
  }
  em{font-style:normal;color:var(--orange);}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}

  a{color:var(--orange);}
  ::selection{background:var(--glow);}

  /* ── TOP BAR ── */
  #topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    height:64px; padding:0 22px;
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .wordmark{font-family:'GuideSerif',Georgia,serif; font-size:22px; color:var(--ink);}
  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); border-left:1px solid var(--border2); padding-left:14px;
  }
  #backBtn{
    display:none; align-items:center; gap:6px; margin-left:auto;
    background:var(--card); border:1px solid var(--border2); color:var(--ink);
    font-size:14px; font-weight:600; padding:8px 16px; border-radius:20px; cursor:pointer;
    font-family:inherit; transition:border-color .15s, background .15s;
  }
  #backBtn:hover{border-color:var(--orange); background:var(--orange-soft);}
  #backBtn:focus-visible, .topic-tile:focus-visible, .navbtn:focus-visible{
    outline:2px solid var(--orange); outline-offset:2px;
  }
  body.detail-open #backBtn{display:inline-flex;}
  body.detail-open #landing{display:none;}

  /* ── LANDING ── */
  #landing{max-width:1080px; margin:0 auto; padding:56px 24px 90px;}
  .hero-kicker{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);}
  .hero-title{font-size:clamp(30px,4.2vw,44px); margin-top:10px; max-width:720px;}
  .hero-sub{font-size:17px; color:var(--muted); max-width:560px; margin-top:14px; line-height:1.7;}

  .topic-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px; margin-top:42px;
  }
  .topic-tile{
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    text-align:left; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:20px 18px; cursor:pointer;
    font-family:inherit; color:var(--ink);
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .topic-tile:hover{border-color:var(--orange); box-shadow:var(--shadow); transform:translateY(-2px);}
  .topic-ico{font-size:38px; line-height:1;}
  .topic-name{font-size:16.5px; font-weight:700;}
  .topic-teaser{font-size:13px; color:var(--muted); line-height:1.5;}
  @media (prefers-reduced-motion: reduce){
    .topic-tile{transition:none;}
    .topic-tile:hover{transform:none;}
  }

  /* ── DETAIL VIEW ── */
  .topic-detail{display:none; max-width:1160px; margin:0 auto; padding:44px 24px 100px;}
  body.detail-open .topic-detail.active{display:block;}

  .detail-eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--orange);}
  .detail-title{font-size:clamp(26px,3.4vw,36px); margin-top:8px;}
  .detail-intro{font-size:15.5px; color:var(--muted); max-width:640px; margin-top:10px; line-height:1.7;}

  .detail-cols{
    display:grid; grid-template-columns:minmax(280px,380px) 1fr;
    gap:36px; margin-top:34px; align-items:start;
  }
  @media (max-width:820px){ .detail-cols{grid-template-columns:1fr;} }

  .steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:18px;}
  .steps li{display:flex; gap:14px;}
  .step-num{
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    background:var(--orange); color:#fff; font-size:13px; font-weight:700;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  /* > : only the step title is a block; <b> inside the description stays inline (9J) */
  .step-body > b{display:block; font-size:15px; margin-bottom:3px;}
  .step-body > span{font-size:14px; color:var(--muted); line-height:1.6;}

  .mockup-wrap{
    position:sticky; top:86px;
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:18px; box-shadow:var(--shadow);
  }
  .mockup-wrap svg{display:block; width:100%; height:auto; border-radius:8px;}

  .detail-nav{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:56px; padding-top:22px; border-top:1px solid var(--border);
    gap:12px; flex-wrap:wrap;
  }
  .navbtn{
    background:var(--panel); border:1px solid var(--border2); color:var(--ink);
    font-family:inherit; font-size:13.5px; font-weight:600;
    padding:10px 16px; border-radius:10px; cursor:pointer;
    transition:border-color .15s;
  }
  .navbtn:hover{border-color:var(--orange);}
  .navbtn .lbl{display:block; font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.5px; text-transform:uppercase; margin-bottom:2px;}

  /* ── SVG MOCKUP SHARED TOKENS (used inline via CSS vars aren't inherited into SVG presentation attrs reliably in all renderers, so mockups use literal hexes matching the tokens above) ── */
  .callout-num{font-family:ui-monospace,'SF Mono',Menlo,monospace; font-weight:700; font-size:12px;}
</style>
</head>
<body>

<div id="topbar">
  <div class="wordmark">Map<em>It</em></div>
  <div class="eyebrow">User Guide</div>
  <button id="backBtn" onclick="showLanding()">← All topics</button>
</div>

<main id="landing">
  <div class="hero-kicker">How MapIt works</div>
  <h1 class="hero-title">One topic at a time — pick what you need help with.</h1>
  <p class="hero-sub">Sixteen short walkthroughs covering everything from your first sign-up to reporting a bad listing. Each one shows exactly where to tap.</p>

  <div class="topic-grid" id="topicGrid"></div>
</main>

<div id="topicDetails"></div>

<script>
/* ── Reusable schematic SVG mockups, drawn in the app's own palette ── */
const C = { orange:'#F06030', orange2:'#FF7A50', blue:'#3B82F6', green:'#22C55E', gold:'#F59E0B', red:'#EF4444',
            panel:'#FFFFFF', card:'#F0F3F8', border:'#D8DEE7', ink:'#111827', muted:'#5F6773', map:'#E4EBF1' };

function callout(x,y,n){
  return `<circle cx="${x}" cy="${y}" r="11" fill="${C.orange}" stroke="#fff" stroke-width="1.5"/>
    <text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" class="callout-num">${n}</text>`;
}
function leader(x1,y1,x2,y2){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.orange}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
}
function ring(x,y,w,h,r=8){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="${C.orange}" stroke-width="2.5"/>`;
}
function header(){
  return `
  <rect x="0" y="0" width="640" height="40" fill="${C.panel}"/>
  <line x1="0" y1="40" x2="640" y2="40" stroke="${C.border}"/>
  <text x="16" y="25" font-family="Georgia,serif" font-size="16" fill="${C.ink}">Map<tspan fill="${C.orange}">It</tspan></text>
  <rect x="200" y="10" width="240" height="20" rx="10" fill="${C.card}" stroke="${C.border}"/>
  <text x="212" y="24" font-size="10.5" fill="${C.muted}">🔍 Search a location…</text>
  <rect x="452" y="10" width="98" height="20" rx="10" fill="${C.card}" stroke="${C.border}"/>
  <text x="464" y="24" font-size="10" fill="${C.muted}">📍 Koramangala</text>
  <circle cx="610" cy="20" r="12" fill="${C.orange}"/>
  <text x="610" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">N</text>
  `;
}
function sidebarFrame(){
  return `
  <rect x="0" y="40" width="200" height="380" fill="${C.panel}"/>
  <line x1="200" y1="40" x2="200" y2="420" stroke="${C.border}"/>
  ${['🗺️ All','🏠 RE','🚗 Veh','🏡 HH'].map((l,i)=>`
    <circle cx="${28+i*44}" cy="66" r="15" fill="${C.card}" stroke="${C.border}"/>
    <text x="${28+i*44}" y="70" text-anchor="middle" font-size="12">${l.split(' ')[0]}</text>
    <text x="${28+i*44}" y="90" text-anchor="middle" font-size="7.5" fill="${C.muted}">${l.split(' ')[1]}</text>
  `).join('')}
  <line x1="14" y1="104" x2="186" y2="104" stroke="${C.border}"/>
  <text x="14" y="120" font-size="8" font-weight="700" letter-spacing="1" fill="${C.muted}">RADIUS</text>
  ${['3km','5km','10km','City'].map((l,i)=>`
    <rect x="${14+i*44}" y="126" width="38" height="20" rx="6" fill="${i===1?C.orange:C.card}" stroke="${i===1?C.orange:C.border}"/>
    <text x="${33+i*44}" y="139" text-anchor="middle" font-size="9" fill="${i===1?'#fff':C.muted}">${l}</text>
  `).join('')}
  <line x1="14" y1="158" x2="186" y2="158" stroke="${C.border}"/>
  <rect x="14" y="168" width="172" height="22" rx="11" fill="${C.card}" stroke="${C.border}"/>
  <rect x="16" y="170" width="84" height="18" rx="9" fill="${C.orange}"/>
  <text x="58" y="182" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">📍 Listings</text>
  <text x="144" y="182" text-anchor="middle" font-size="8.5" fill="${C.muted}">❤ Saved</text>
  <rect x="14" y="200" width="172" height="76" rx="10" fill="${C.card}" stroke="${C.border}"/>
  <rect x="20" y="206" width="46" height="46" rx="6" fill="${C.card2}"/>
  <text x="43" y="234" text-anchor="middle" font-size="16">🏠</text>
  <text x="74" y="218" font-size="10" font-weight="700" fill="${C.ink}">2BHK Apartment</text>
  <text x="74" y="232" font-size="11" font-weight="700" fill="${C.orange}">₹45,000/mo</text>
  <text x="74" y="245" font-size="8.5" fill="${C.muted}">1.2 km away</text>
  <circle cx="176" cy="212" r="8" fill="none" stroke="${C.red}" stroke-width="1.3"/>
  <text x="176" y="215" text-anchor="middle" font-size="9">🤍</text>
  <rect x="14" y="284" width="172" height="76" rx="10" fill="${C.card}" stroke="${C.border}"/>
  <rect x="20" y="290" width="46" height="46" rx="6" fill="${C.card2}"/>
  <text x="43" y="318" text-anchor="middle" font-size="16">🚗</text>
  <text x="74" y="302" font-size="10" font-weight="700" fill="${C.ink}">Honda City 2019</text>
  <text x="74" y="316" font-size="11" font-weight="700" fill="${C.orange}">₹6.8L</text>
  <text x="74" y="329" font-size="8.5" fill="${C.muted}">2.8 km away</text>
  `;
}
function mapFrame(highlightPin){
  const pins = [ [320,120],[420,180],[360,260],[480,320],[280,340] ];
  return `
  <rect x="200" y="40" width="440" height="380" fill="${C.map}"/>
  ${pins.map(([x,y],i)=>{
    const big = highlightPin && i===2;
    return `<circle cx="${x}" cy="${y}" r="${big?12:7}" fill="${big?C.orange:C.blue}" stroke="#fff" stroke-width="2"/>`;
  }).join('')}
  `;
}
const MOCKUPS = {};

MOCKUPS.main = function(hl){
  let extra = '';
  if(hl==='browse') extra = ring(12,50,182,50)+ring(200,40,440,380)+callout(103,36,1)+callout(410,64,2)+leader(103,47,103,60)+leader(400,64,410,64);
  if(hl==='search') extra = ring(198,8,244,24)+callout(320,-2>0?2:2,1);
  if(hl==='radius') extra = ring(12,122,180,28)+callout(20,110,1)+leader(20,117,20,122);
  if(hl==='save') extra = ring(166,202,20,20)+ring(14,168,172,22)+callout(190,190,1)+callout(58,158,2)+leader(180,195,190,190)+leader(58,168,58,158);
  return `<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
    ${mapFrame(hl==='browse')}${sidebarFrame()}${header()}${extra}
  </svg>`;
};

    <rect width="500" height="420" fill="${C.card}"/>

    <text x="250" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="${C.ink}">Map<tspan fill="${C.orange}">It</tspan></text>
    <rect x="118" y="106" width="128" height="26" rx="8" fill="${C.orange}"/>
    <text x="182" y="123" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Sign Up</text>
    <rect x="254" y="106" width="128" height="26" rx="8" fill="${C.card}" stroke="${C.border}"/>
    <text x="318" y="123" text-anchor="middle" font-size="10.5" fill="${C.muted}">Sign In</text>
    ${ring(112,100,140,32)}${callout(112,90,1)}${leader(112,96,112,100)}
    <rect x="118" y="152" width="264" height="26" rx="7" fill="${C.card}" stroke="${C.border}"/>
    <text x="128" y="169" font-size="10" fill="${C.muted}">Email address</text>
    <rect x="118" y="188" width="264" height="26" rx="7" fill="${C.card}" stroke="${C.border}"/>
    <text x="128" y="205" font-size="10" fill="${C.muted}">Password</text>
    <rect x="118" y="224" width="264" height="30" rx="8" fill="${C.orange}"/>
    <text x="250" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Create Account</text>
    <text x="250" y="270" text-anchor="middle" font-size="9.5" fill="${C.muted}">— or —</text>
    <rect x="118" y="280" width="264" height="28" rx="8" fill="${C.panel}" stroke="${C.border2}"/>
    <text x="250" y="299" text-anchor="middle" font-size="10" fill="${C.ink}">🔵 Continue with Google</text>
    <rect x="118" y="316" width="264" height="28" rx="8" fill="${C.panel}" stroke="${C.border2}"/>
    <text x="250" y="335" text-anchor="middle" font-size="10" fill="${C.ink}">✉️ Email me a one-time code</text>
    ${callout(390,290,2)}${leader(382,294,390,290)}
    <rect x="150" y="356" width="200" height="18" rx="9" fill="${C.card2}"/>
    <text x="250" y="369" text-anchor="middle" font-size="8.5" letter-spacing="2" fill="${C.muted}">6 · 2 · 9 · 1 · 4 · 7</text>
    ${callout(360,365,3)}${leader(350,365,360,365)}
  </svg>`;
};

MOCKUPS.homeloc = function(){
  return `<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="520" height="400" fill="${C.map}"/>
    <rect x="60" y="30" width="400" height="340" rx="14" fill="${C.panel}" stroke="${C.border}"/>
    <text x="80" y="60" font-size="14" font-weight="700" fill="${C.ink}">📍 My Locations</text>
    <line x1="60" y1="76" x2="460" y2="76" stroke="${C.border}"/>
    <rect x="80" y="92" width="360" height="24" rx="8" fill="${C.card}" stroke="${C.border}"/>
    <text x="92" y="108" font-size="10.5" fill="${C.muted}">🔍 Search your area…</text>
    ${callout(80,84,1)}${leader(80,88,80,92)}
    <rect x="80" y="130" width="360" height="180" rx="10" fill="${C.card2}"/>
    <circle cx="260" cy="220" r="9" fill="${C.orange}" stroke="#fff" stroke-width="2.5"/>
    <line x1="260" y1="220" x2="260" y2="196" stroke="${C.orange}" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="260" y="192" text-anchor="middle" font-size="9" fill="${C.muted}">drag to adjust</text>
    ${callout(300,240,2)}${leader(268,224,300,240)}
    <rect x="80" y="322" width="200" height="30" rx="8" fill="${C.orange}"/>
    <text x="180" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Save Location</text>
    ${callout(300,320,3)}${leader(280,332,300,320)}
  </svg>`;
};

MOCKUPS.explore = function(){
  let s = MOCKUPS.main();
  const extra = ring(60,168,64,22)+callout(60,158,1)
    + ring(12,196,176,22)+callout(190,196,2)+leader(176,196,190,196)
    + ring(198,44,244,24)+callout(320,32,3);
  return s.replace('</svg>', extra+'</svg>');
};

MOCKUPS.listing = function(){
  return `<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg">
    <rect width="560" height="440" fill="${C.card}"/>
    <rect x="60" y="24" width="440" height="392" rx="14" fill="${C.panel}" stroke="${C.border}"/>
    <rect x="60" y="24" width="440" height="140" rx="14" fill="${C.card2}"/>
    <text x="280" y="100" text-anchor="middle" font-size="34">🏠</text>
    <circle cx="470" cy="52" r="13" fill="${C.panel}" stroke="${C.border2}"/>
    <text x="470" y="56" text-anchor="middle" font-size="12">🤍</text>
    ${callout(490,40,3)}${leader(480,48,490,40)}
    <text x="82" y="188" font-size="15" font-weight="700" fill="${C.ink}">Spacious 2BHK Apartment</text>
    <text x="82" y="210" font-size="17" font-weight="700" fill="${C.orange}">₹45,000 / mo</text>
    <rect x="82" y="222" width="72" height="18" rx="9" fill="${C.card}" stroke="${C.border}"/>
    <text x="118" y="235" text-anchor="middle" font-size="8.5" fill="${C.muted}">2 BHK</text>
    <rect x="160" y="222" width="90" height="18" rx="9" fill="${C.card}" stroke="${C.border}"/>
    <text x="205" y="235" text-anchor="middle" font-size="8.5" fill="${C.muted}">Semi-Furnished</text>
    ${callout(82,214,1)}${leader(82,204,82,214)}
    <line x1="82" y1="252" x2="478" y2="252" stroke="${C.border}"/>
    <text x="82" y="272" font-size="10" font-weight="700" letter-spacing="1" fill="${C.muted}">📍 NEARBY</text>
    <text x="82" y="290" font-size="10.5" fill="${C.ink}">🏫 JSS School — 450 m</text>
    <text x="82" y="306" font-size="10.5" fill="${C.ink}">🏬 Total Mall — 900 m</text>
    <text x="82" y="322" font-size="10.5" fill="${C.ink}">🛒 More Supermarket — 650 m</text>
    ${ring(72,262,410,68)}${callout(490,270,2)}${leader(482,278,490,270)}
    <rect x="82" y="356" width="360" height="32" rx="8" fill="${C.green}"/>
    <text x="262" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🤝 I&#8217;m Interested</text>
  </svg>`;
};

MOCKUPS.post = function(){
  return `<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg">

const grid = document.getElementById('topicGrid');
const detailsHost = document.getElementById('topicDetails');

TOPICS.forEach((t,i)=>{
  const tile = document.createElement('button');
  tile.className = 'topic-tile';
  tile.innerHTML = `<span class="topic-ico">${t.ico}</span><span class="topic-name">${t.name}</span><span class="topic-teaser">${t.teaser}</span>`;
  tile.onclick = ()=>showTopic(t.id);
  grid.appendChild(tile);
});

TOPICS.forEach((t,i)=>{
  const sec = document.createElement('section');
  sec.className = 'topic-detail';
  sec.id = 'topic-'+t.id;
  const stepsHtml = t.steps.map((s,idx)=>`
    <li><span class="step-num">${idx+1}</span><span class="step-body"><b>${s[0]}</b><span>${s[1]}</span></span></li>
  `).join('');
  const prev = TOPICS[i-1], next = TOPICS[i+1];
  sec.innerHTML = `
    <div class="detail-eyebrow">Topic ${i+1} of ${TOPICS.length}</div>
    <h2 class="detail-title">${t.ico} ${t.name}</h2>
    <p class="detail-intro">${t.intro}</p>
    <div class="detail-cols">
      <ol class="steps">${stepsHtml}</ol>
      <div class="mockup-wrap">${MOCKUPS[t.mockup](t.highlight)}</div>
    </div>
    <div class="detail-nav">
      ${prev ? `<button class="navbtn" onclick="showTopic('${prev.id}')"><span class="lbl">← Previous</span>${prev.name}</button>` : '<span></span>'}
      ${next ? `<button class="navbtn" onclick="showTopic('${next.id}')"><span class="lbl">Next →</span>${next.name}</button>` : '<span></span>'}
    </div>
  `;
  detailsHost.appendChild(sec);
});

function showTopic(id){
  document.body.classList.add('detail-open');
  document.querySelectorAll('.topic-detail').forEach(el=>el.classList.remove('active'));
  document.getElementById('topic-'+id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}
function showLanding(){
  document.body.classList.remove('detail-open');
  window.scrollTo({top:0, behavior:'instant'});
}
</script>
