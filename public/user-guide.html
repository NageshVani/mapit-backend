<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapIt — User Guide</title>
<style>
  @font-face {
    font-family: 'GuideSerif';
    src: local('Georgia'), local('Times New Roman');
  }

  :root{
    --orange:#F06030; --orange2:#FF7A50; --orange-soft:#FDE4DA;
    --ground:#F7F9FC; --panel:#FFFFFF; --card:#F0F3F8; --card2:#E3E8F0;
    --ink:#111827; --muted:#5F6773; --muted2:#4B5563;
    --border:rgba(17,24,39,0.09); --border2:rgba(17,24,39,0.15);
    --blue:#3B82F6; --green:#22C55E; --gold:#F59E0B; --red:#EF4444;
    --glow:rgba(240,96,48,.16);
    --shadow:0 10px 34px rgba(17,24,39,.10);
    --map:#EAF0F4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#12161D; --panel:#1A2029; --card:#20272F; --card2:#2A323C;
      --ink:#EEF1F5; --muted:#98A2B0; --muted2:#B8C0CC;
      --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
      --glow:rgba(240,96,48,.22);
      --shadow:0 10px 34px rgba(0,0,0,.42);
      --map:#171D25;
    }
  }
  :root[data-theme="dark"]{
    --ground:#12161D; --panel:#1A2029; --card:#20272F; --card2:#2A323C;
    --ink:#EEF1F5; --muted:#98A2B0; --muted2:#B8C0CC;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
    --glow:rgba(240,96,48,.22);
    --shadow:0 10px 34px rgba(0,0,0,.42);
    --map:#171D25;
  }
  :root[data-theme="light"]{
    --ground:#F7F9FC; --panel:#FFFFFF; --card:#F0F3F8; --card2:#E3E8F0;
    --ink:#111827; --muted:#5F6773; --muted2:#4B5563;
    --border:rgba(17,24,39,0.09); --border2:rgba(17,24,39,0.15);
    --glow:rgba(240,96,48,.16);
    --shadow:0 10px 34px rgba(17,24,39,.10);
    --map:#EAF0F4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.6;
  }
  h1,h2,h3{
    font-family:'GuideSerif',Georgia,'Times New Roman',serif;
    font-weight:400; text-wrap:balance; margin:0;
  }
  em{font-style:normal;color:var(--orange);}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}

  a{color:var(--orange);}
  ::selection{background:var(--glow);}

  /* ── TOP BAR ── */
  #topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    height:64px; padding:0 22px;
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .wordmark{font-family:'GuideSerif',Georgia,serif; font-size:22px; color:var(--ink);}
  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); border-left:1px solid var(--border2); padding-left:14px;
  }
  #backBtn{
    display:none; align-items:center; gap:6px; margin-left:auto;
    background:var(--card); border:1px solid var(--border2); color:var(--ink);
    font-size:14px; font-weight:600; padding:8px 16px; border-radius:20px; cursor:pointer;
    font-family:inherit; transition:border-color .15s, background .15s;
  }
  #backBtn:hover{border-color:var(--orange); background:var(--orange-soft);}
  #backBtn:focus-visible, .topic-tile:focus-visible, .navbtn:focus-visible{
    outline:2px solid var(--orange); outline-offset:2px;
  }
  body.detail-open #backBtn{display:inline-flex;}
  body.detail-open #landing{display:none;}

  /* ── LANDING ── */
  #landing{max-width:1080px; margin:0 auto; padding:56px 24px 90px;}
  .hero-kicker{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);}
  .hero-title{font-size:clamp(30px,4.2vw,44px); margin-top:10px; max-width:720px;}
  .hero-sub{font-size:17px; color:var(--muted); max-width:560px; margin-top:14px; line-height:1.7;}

  .topic-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px; margin-top:42px;
  }
  .topic-tile{
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    text-align:left; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:20px 18px; cursor:pointer;
    font-family:inherit; color:var(--ink);
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .topic-tile:hover{border-color:var(--orange); box-shadow:var(--shadow); transform:translateY(-2px);}
  .topic-ico{font-size:38px; line-height:1;}
  .topic-name{font-size:16.5px; font-weight:700;}
  .topic-teaser{font-size:13px; color:var(--muted); line-height:1.5;}
  @media (prefers-reduced-motion: reduce){
    .topic-tile{transition:none;}
    .topic-tile:hover{transform:none;}
  }

  /* ── DETAIL VIEW ── */
  .topic-detail{display:none; max-width:1160px; margin:0 auto; padding:44px 24px 100px;}
  body.detail-open .topic-detail.active{display:block;}

  .detail-eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--orange);}
  .detail-title{font-size:clamp(26px,3.4vw,36px); margin-top:8px;}
  .detail-intro{font-size:15.5px; color:var(--muted); max-width:640px; margin-top:10px; line-height:1.7;}

  .detail-cols{
    display:grid; grid-template-columns:minmax(280px,380px) 1fr;
    gap:36px; margin-top:34px; align-items:start;
  }
  @media (max-width:820px){ .detail-cols{grid-template-columns:1fr;} }

  .steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:18px;}
  .steps li{display:flex; gap:14px;}
  .step-num{
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    background:var(--orange); color:#fff; font-size:13px; font-weight:700;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  /* > : only the step title is a block; <b> inside the description stays inline (9J) */
  .step-body > b{display:block; font-size:15px; margin-bottom:3px;}
  .step-body > span{font-size:14px; color:var(--muted); line-height:1.6;}

  .mockup-wrap{
    position:sticky; top:86px;
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:18px; box-shadow:var(--shadow);
  }
  .mockup-wrap:empty{display:none;}
  /* Session 9J — phone screenshot + a ring and number over each step's button */
  .shot{position:relative; max-width:300px; margin:0 auto;}
  .shot img{display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--border2);}
  .mk-ring{position:absolute; border:2.5px solid var(--orange); border-radius:8px; box-shadow:0 0 0 3px rgba(240,96,48,.22); pointer-events:none;}
  .mk-num{position:absolute; transform:translate(-45%,-45%); width:24px; height:24px; border-radius:50%;
    background:var(--orange); color:#fff; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.3);
    font:700 12px/20px ui-monospace,'SF Mono',Menlo,monospace; text-align:center; pointer-events:none;}

  .detail-nav{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:56px; padding-top:22px; border-top:1px solid var(--border);
    gap:12px; flex-wrap:wrap;
  }
  .navbtn{
    background:var(--panel); border:1px solid var(--border2); color:var(--ink);
    font-family:inherit; font-size:13.5px; font-weight:600;
    padding:10px 16px; border-radius:10px; cursor:pointer;
    transition:border-color .15s;
  }
  .navbtn:hover{border-color:var(--orange);}
  .navbtn .lbl{display:block; font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.5px; text-transform:uppercase; margin-bottom:2px;}

</style>
</head>
<body>

<div id="topbar">
  <div class="wordmark">Map<em>It</em></div>
  <div class="eyebrow">User Guide</div>
  <button id="backBtn" onclick="showLanding()">← All topics</button>
</div>

<main id="landing">
  <div class="hero-kicker">How MapIt works</div>
  <h1 class="hero-title">One topic at a time — pick what you need help with.</h1>
  <p class="hero-sub">Sixteen short walkthroughs covering everything from your first sign-up to reporting a bad listing. Each one shows exactly where to tap.</p>

  <div class="topic-grid" id="topicGrid"></div>
</main>

<div id="topicDetails"></div>

<!-- Session 9J: real phone screenshots replace the hand-drawn SVG mockups.
     public/guide/*.webp + shots.js are generated by scripts/guide-shots.js (npm run guide:shots). -->
<script src="guide/shots.js"></script>

<script>
const TOPICS = [
  { id:'start', ico:'🚀', name:'Getting Started', teaser:'Create your account in a couple of minutes.',
    intro:'Sign up with the method that suits you. MapIt then asks for your name, your phone (via WhatsApp) and your home area.',
    steps:[
      ['Choose how to sign up','Tap <b>Create Account</b> and use email + password, or <b>Continue with Google</b>.'],
      ['Confirm your email','If asked, enter the 6-digit code sent to your inbox.'],
      ['Add your name and nickname','Your nickname is what other people see. Tick the Terms box to continue.']
    ] },

  { id:'phone', ico:'📱', name:'Verifying Your Phone', teaser:'A one-time WhatsApp code, needed before you post.',
    intro:'MapIt checks that your phone number is really yours with a 6-digit code sent on WhatsApp from <b>MapIt</b>. You can browse without it, but you need it to post a listing.',
    steps:[
      ['Enter your mobile number','A 10-digit Indian mobile number. One number can be verified on only one MapIt account.'],
      ['Enter the WhatsApp code','The code is valid for 10 minutes. Didn’t get it? Wait a minute and tap Resend.'],
      ['Or tap Verify later','You can verify any time from <b>👤 View Profile</b>, or when you first tap Post a Listing.']
    ] },

  { id:'home', ico:'📍', name:'Setting Your Home Location', teaser:'Tell MapIt where you are so nearby listings show first.',
    intro:'Your saved location is the centre MapIt measures distance from. You set one when you sign up and can add more later (home, office…).',
    steps:[
      ['Open My Locations','Tap your avatar (top right), then <b>📍 My Locations</b>.'],
      ['Find your spot','Search your area by name, tap the map, or paste coordinates, then adjust the pin.'],
      ['Switch between them','Tap <b>📍 My location ▾</b> in the top bar to pick which saved location to use.']
    ] },

  { id:'browse', ico:'🗺️', name:'Browsing Listings', teaser:'See what’s for sale or rent near you, on the map or as a list.',
    intro:'Listings near your location show as pins on the map and as cards in the list. Yellow bubbles group several listings — tap one to zoom in.',
    steps:[
      ['Map or list','On a computer you see both. On a phone, switch with the <b>☰ List / 🗺 Map</b> buttons at the bottom.'],
      ['Pick a category','<b>All</b>, <b>Rent Property</b>, <b>Buy Property</b>, <b>Vehicles</b> or <b>Household</b>, then a sub-type if you like.'],
      ['Open a listing','Tap any pin or card to see full details.']
    ] },

  { id:'search', ico:'🔎', name:'Searching by Keyword', teaser:'Find listings by a word in the title, area or type.',
    intro:'The search box sits just under the category icons. It filters the listings in the part of the map you are looking at.',
    steps:[
      ['Type a word','For example <b>honda</b>, <b>2BHK</b> or <b>sofa</b>. Results update as you type.'],
      ['Not finding it?','Zoom the map out or pick a bigger distance — the search only covers what’s on screen.'],
      ['Clear the search','Tap <b>×</b> in the box. On the map, a <b>🔍 “word” ×</b> tag shows while a search is active.']
    ] },

  { id:'radius', ico:'🎯', name:'Filtering by Distance', teaser:'Show only listings within 1, 3, 5, 10 km, a 50 km region, or the whole city.',
    intro:'The <b>Within 5 km ▾</b> chip in the top bar controls how far MapIt looks from your location. The default is 5 km.',
    steps:[
      ['Pick a distance','Tap the chip, then choose 1 km, 3 km, 5 km, 10 km, Region (50 km) or Whole city.'],
      ['Map redraws','Only listings inside that circle are shown.'],
      ['Change anytime','Switch as often as you like — nothing else resets.']
    ] },

  { id:'explore', ico:'🧭', name:'Exploring Other Areas', teaser:'Browse a neighbourhood that isn’t yours, without changing your saved location.',
    intro:'Explore lets you look around any part of the city — handy for house-hunting somewhere new.',
    steps:[
      ['Switch to Explore','Tap <b>🗺 Explore</b> in the top bar.'],
      ['Search a place','Type an area in the <b>Search area to jump there…</b> box on the map, or just drag the map.'],
      ['Come back','Tap <b>📍 My location</b> to return to your saved location.']
    ] },

  { id:'view', ico:'🏷️', name:'Viewing a Listing', teaser:'Photos, price, details, and what’s nearby.',
    intro:'Every listing opens into a detail panel with photos, price, details and a 📍 Nearby section (schools, malls, supermarkets).',
    steps:[
      ['Photos and details','Up to 5 photos plus details for the category (BHK, brand, year, condition…).'],
      ['Approximate location','The pin shows the area, not the exact address, unless the seller chose to share it.'],
      ['Act on it','Under the title: <b>🤝 I’m Interested</b>, ♡ save, 🚩 report and 🔗 share.']
    ] },

  { id:'save', ico:'❤️', name:'Saving Listings', teaser:'Bookmark listings to compare later.',
    intro:'Tap the heart on a listing to keep it in your Saved tab.',
    steps:[
      ['Tap ♡','In the button row under the listing’s title. It turns into ❤.'],
      ['Find it in Saved','Open the <b>❤ Saved</b> tab anytime to see everything you’ve saved.'],
      ['Remove anytime','Tap ❤ again to take it off your Saved list.']
    ] },

  { id:'post', ico:'➕', name:'Posting a Listing', teaser:'List a home, vehicle, or item in a few steps.',
    intro:'Posting needs a verified phone number (see Verifying Your Phone). Each new listing is checked by our team before it goes live, usually within 4 hours.',
    steps:[
      ['Tap Post a Listing','The orange <b>➕ Post a Listing</b> button in the top bar.'],
      ['Fill in the details','Pick a category and type, add up to 5 photos (optional for Plots) and describe it.'],
      ['Place the pin and submit','Set the location on the map. Buyers see an approximate area unless you choose to show the exact spot.']
    ] },

  { id:'myads', ico:'📋', name:'Managing Your Listings', teaser:'Edit, mark as sold, or delete what you’ve posted.',
    intro:'Everything you’ve posted is in the My Listings tab, with its status and how long until it expires.',
    steps:[
      ['Open My Listings','Tap the <b>📋 My Listings</b> tab.'],
      ['Take an action','Edit it, mark it <b>✅ Sold</b>, or delete it. An edited listing is checked again before it goes live.'],
      ['Watch the expiry','Each listing shows how many days it has left.']
    ] },

  { id:'contact', ico:'🤝', name:'Contacting a Seller', teaser:'Send an interest note, then keep chatting.',
    intro:'Your first note reaches the seller by email. Once they reply, you continue in Chat.',
    steps:[
      ['Tap I’m Interested','On the listing’s detail view.'],
      ['Write a short note','Say what you’d like to know. The seller is emailed right away.'],
      ['Continue in Chat','Tap <b>💬 Chat with seller</b> on the listing, or open <b>📥 Inbox</b> from your avatar menu.']
    ] },

  { id:'report', ico:'🚩', name:'Reporting a Listing', teaser:'Flag something fake, spammy, or offensive.',
    intro:'Reports go to our review queue. Nothing is removed automatically — a real person checks each one.',
    steps:[
      ['Tap 🚩','In the button row on the listing’s detail view.'],
      ['Choose a reason','Fake, Wrong price, Spam, Offensive, or Other.'],
      ['Add a note (optional)','Submit — our team takes it from there.']
    ] },

  { id:'profile', ico:'👤', name:'Your Profile', teaser:'Your details, nickname, and signing out.',
    intro:'Tap your avatar (top right) for your profile menu. On a shared device, family members can switch accounts here.',
    steps:[
      ['View your profile','<b>👤 View Profile</b> shows your name, email, phone (✓ verified) and home location.'],
      ['Change your nickname','<b>✏️ Change Nickname</b>. To change your email or phone, write to contact-us@mapit.co.in.'],
      ['Sign out or switch','<b>Sign Out &amp; Switch User</b> at the bottom of the menu.']
    ] },

  { id:'feedback', ico:'⭐', name:'Giving Feedback', teaser:'Tell us what works, what doesn’t, or report a bug.',
    intro:'Feedback goes directly to the MapIt team — every message is read.',
    steps:[
      ['Open Feedback','Tap <b>💡 Share Feedback</b> at the bottom of the listings panel.'],
      ['Pick a type','Suggestion, Bug, Praise or Complaint. A 1–5 star rating is optional.'],
      ['Send it','Write at least 10 characters and tap <b>Send Feedback</b>.']
    ] },

  { id:'legal', ico:'📄', name:'Privacy & Terms', teaser:'What we collect, and your rights as a user.',
    intro:'Our Terms of Service and Privacy Policy are shown when you sign up and are always in your profile menu.',
    steps:[
      ['Find the links','<b>📄 Terms of Service</b> and <b>🔒 Privacy Policy</b> in the avatar menu.'],
      ['Know your rights','They explain what data we collect and how it’s used.'],
      ['Have a concern?','Contact our Grievance Officer at contact-us@mapit.co.in.']
    ] },
];

// Session 9J — real phone screenshot for a topic, with a ring + number over each
// step's button. Positions are % of the 390×844 shot (see public/guide/shots.js).
function shotHtml(t){
  const sh = (window.GUIDE_SHOTS || {})[t.id];
  if(!sh) return '';
  const marks = sh.marks.map(m =>
    `<span class="mk-ring" style="left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%"></span>` +
    `<span class="mk-num" style="left:${Math.max(m.x, 3)}%;top:${Math.max(m.y, 2)}%">${m.n}</span>`).join('');
  return `<figure class="shot"><img src="guide/${t.id}.webp?v=${sh.v}" width="${sh.w}" height="${sh.h}" alt="Phone screenshot: ${t.name}" loading="lazy">${marks}</figure>`;
}

const grid = document.getElementById('topicGrid');
const detailsHost = document.getElementById('topicDetails');

TOPICS.forEach((t,i)=>{
  const tile = document.createElement('button');
  tile.className = 'topic-tile';
  tile.innerHTML = `<span class="topic-ico">${t.ico}</span><span class="topic-name">${t.name}</span><span class="topic-teaser">${t.teaser}</span>`;
  tile.onclick = ()=>showTopic(t.id);
  grid.appendChild(tile);
});

TOPICS.forEach((t,i)=>{
  const sec = document.createElement('section');
  sec.className = 'topic-detail';
  sec.id = 'topic-'+t.id;
  const stepsHtml = t.steps.map((s,idx)=>`
    <li><span class="step-num">${idx+1}</span><span class="step-body"><b>${s[0]}</b><span>${s[1]}</span></span></li>
  `).join('');
  const prev = TOPICS[i-1], next = TOPICS[i+1];
  sec.innerHTML = `
    <div class="detail-eyebrow">Topic ${i+1} of ${TOPICS.length}</div>
    <h2 class="detail-title">${t.ico} ${t.name}</h2>
    <p class="detail-intro">${t.intro}</p>
    <div class="detail-cols">
      <ol class="steps">${stepsHtml}</ol>
      <div class="mockup-wrap">${shotHtml(t)}</div>
    </div>
    <div class="detail-nav">
      ${prev ? `<button class="navbtn" onclick="showTopic('${prev.id}')"><span class="lbl">← Previous</span>${prev.name}</button>` : '<span></span>'}
      ${next ? `<button class="navbtn" onclick="showTopic('${next.id}')"><span class="lbl">Next →</span>${next.name}</button>` : '<span></span>'}
    </div>
  `;
  detailsHost.appendChild(sec);
});

function showTopic(id){
  document.body.classList.add('detail-open');
  document.querySelectorAll('.topic-detail').forEach(el=>el.classList.remove('active'));
  document.getElementById('topic-'+id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}
function showLanding(){
  document.body.classList.remove('detail-open');
  window.scrollTo({top:0, behavior:'instant'});
}
</script>
</body>
</html>
